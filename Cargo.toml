[package]
name = "knowledge-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
# MCP Server
rmcp = { version = "0.13", features = ["server", "transport-io", "macros", "elicitation"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Markdown parsing with wiki-link support
pulldown-cmark = "0.13"

# Fast search (ripgrep internals)
grep-regex = "0.1"
grep-searcher = "0.1"
regex = "1"

# File traversal
walkdir = "2"

# Graph operations
petgraph = "0.7"

# Error handling & logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# File system watching
notify = "7"
notify-debouncer-mini = "0.5"

# Content caching
lru = "0.12"

# Embeddings (local, no external runtime)
fastembed = "4"

# Parallel processing
rayon = "1.10"

# Content hashing for embedding invalidation
seahash = "4"

# System directories
dirs = "5"

[dev-dependencies]
tempfile = "3"
anyhow = "1"
# For integration tests - need client feature to create test clients
rmcp = { version = "0.13", features = ["client", "server", "transport-io", "macros", "elicitation"] }
